function exportToCsv() {
  if (!S.j || S.j.length === 0) {
    alert("Aucune écriture comptable dans le journal à exporter.");
    return;
  }
  let csvContent = "\uFEFF"; // UTF-8 BOM for Excel
  csvContent += "Date;Numéro de Pièce;Compte;Intitulé;Tiers (Client/Fournisseur);Échéance;Libellé;Débit;Crédit\n";

  S.j.forEach(l => {
    const row = [
      fd(l.d) || "",
      `"${(l.p || "").replace(/"/g, '""')}"`,
      `"${(l.c || "").replace(/"/g, '""')}"`,
      `"${(l.t || "").replace(/"/g, '""')}"`,
      `"${(l.tr || "").replace(/"/g, '""')}"`,
      fd(l.ec) || "",
      `"${(l.l || "").replace(/"/g, '""')}"`,
      l.db ? String(l.db).replace(".", ",") : "0,00",
      l.cr ? String(l.cr).replace(".", ",") : "0,00"
    ];
    csvContent += row.join(";") + "\n";
  });

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Journal_Comptable_SYSCOHADA_${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

<script>
(function() {
  let ghSha = "";
  let isSyncing = false;
  let pendingPush = false;
  let autoSyncInterval = null;

  function getGhCreds() {
    return {
      owner: localStorage.getItem("gh_owner") || "",
      repo: localStorage.getItem("gh_repo") || "",
      path: localStorage.getItem("gh_path") || "bdd.json",
      token: localStorage.getItem("gh_token") || ""
    };
  }

  function saveGhCreds(owner, repo, path, token) {
    localStorage.setItem("gh_owner", owner);
    localStorage.setItem("gh_repo", repo);
    localStorage.setItem("gh_path", path);
    localStorage.setItem("gh_token", token);
  }

  function isConnected() {
    const c = getGhCreds();
    return Boolean(c.owner && c.repo && c.path && c.token);
  }

  function updateUiStatus() {
    const statusEl = document.getElementById("gh-user-status");
    const syncBtn = document.getElementById("gh-sync-now");
    const discoBtn = document.getElementById("gh-disconnect");
    const creds = getGhCreds();

    if (isConnected()) {
      if (statusEl) statusEl.textContent = `Connecté : ${creds.owner}/${creds.repo} (${creds.path})`;
      if (statusEl) statusEl.style.color = "var(--ok)";
      if (syncBtn) syncBtn.style.display = "";
      if (discoBtn) discoBtn.style.display = "";
    } else {
      if (statusEl) statusEl.textContent = "Non connecté à GitHub (Enregistrement local automatique)";
      if (statusEl) statusEl.style.color = "var(--mut)";
      if (syncBtn) syncBtn.style.display = "none";
      if (discoBtn) discoBtn.style.display = "none";
    }
  }

  async function fetchFromGitHub(silent = false) {
    if (!isConnected() || isSyncing) return;
    const creds = getGhCreds();
    if (!silent) window.ComptaBridge.setStatus("Connexion et lecture du dépôt GitHub...");
    isSyncing = true;

    try {
      const url = `https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${creds.path}`;
      const res = await fetch(url, {
        headers: {
          "Authorization": `token ${creds.token}`,
          "Accept": "application/vnd.github.v3+json"
        }
      });

      if (res.status === 404) {
        window.ComptaBridge.setStatus("Fichier non trouvé sur GitHub. Création initiale en cours...");
        ghSha = "";
        isSyncing = false;
        await pushToGitHub(true);
        return;
      }

      if (!res.ok) {
        throw new Error(`Erreur GitHub HTTP ${res.status}: ${res.statusText}`);
      }

      const fileInfo = await res.json();
      ghSha = fileInfo.sha;

      const rawContent = decodeURIComponent(escape(atob(fileInfo.content)));
      const remoteData = JSON.parse(rawContent);
      const localData = window.ComptaBridge.getState();

      const remoteTs = Number(remoteData.ts || 0);
      const localTs = Number(localData.ts || 0);

      if (remoteTs > localTs) {
        window.ComptaBridge.setState(remoteData);
        window.ComptaBridge.setStatus("Données synchronisées depuis GitHub avec succès !");
      } else if (localTs > remoteTs) {
        window.ComptaBridge.setStatus("Données locales plus récentes. Envoi de la mise à jour à GitHub...");
        isSyncing = false;
        await pushToGitHub(true);
        return;
      } else {
        window.ComptaBridge.setStatus("Données synchronisées avec GitHub.");
      }
    } catch (err) {
      window.ComptaBridge.setStatus("Échec de la synchronisation GitHub : " + err.message);
      console.error("GitHub Fetch Error:", err);
    } finally {
      isSyncing = false;
    }
  }

  async function pushToGitHub(force = false) {
    if (!isConnected()) return;
    if (isSyncing) {
      pendingPush = true;
      return;
    }
    pendingPush = false;
    const creds = getGhCreds();
    window.ComptaBridge.setStatus("Sauvegarde sur votre dépôt GitHub en cours...");
    isSyncing = true;

    try {
      const localData = window.ComptaBridge.getState();
      localData.ts = Date.now();
      const jsonStr = JSON.stringify(localData, null, 2);
      const base64Content = btoa(unescape(encodeURIComponent(jsonStr)));

      const url = `https://api.github.com/repos/${creds.owner}/${creds.repo}/contents/${creds.path}`;
      const payload = {
        message: `Mise à jour Compta SYSCOHADA (${new Date().toLocaleString("fr-FR")})`,
        content: base64Content
      };
      if (ghSha) payload.sha = ghSha;

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `token ${creds.token}`,
          "Content-Type": "application/json",
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.message || `Erreur HTTP ${res.status}`);
      }

      const resData = await res.json();
      ghSha = resData.content.sha;
      window.ComptaBridge.setStatus("Sauvegardé avec succès dans votre dépôt GitHub !");
    } catch (err) {
      window.ComptaBridge.setStatus("Échec de la sauvegarde sur GitHub : " + err.message);
      console.error("GitHub Push Error:", err);
    } finally {
      isSyncing = false;
      if (pendingPush && isConnected()) {
        pendingPush = false;
        setTimeout(() => pushToGitHub(), 350);
      }
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const configToggle = document.getElementById("gh-config-toggle");
    const configForm = document.getElementById("gh-config-form");
    const saveBtn = document.getElementById("gh-save-config");
    const cancelBtn = document.getElementById("gh-cancel-config");
    const syncBtn = document.getElementById("gh-sync-now");
    const discoBtn = document.getElementById("gh-disconnect");

    const ownerInput = document.getElementById("gh-owner");
    const repoInput = document.getElementById("gh-repo");
    const pathInput = document.getElementById("gh-path");
    const tokenInput = document.getElementById("gh-token");

    const creds = getGhCreds();
    if (ownerInput) ownerInput.value = creds.owner;
    if (repoInput) repoInput.value = creds.repo;
    if (pathInput) pathInput.value = creds.path;
    if (tokenInput) tokenInput.value = creds.token;

    updateUiStatus();

    if (configToggle) {
      configToggle.onclick = () => {
        configForm.style.display = configForm.style.display === "none" ? "block" : "none";
      };
    }

    if (cancelBtn) {
      cancelBtn.onclick = () => {
        configForm.style.display = "none";
      };
    }

    if (saveBtn) {
      saveBtn.onclick = async () => {
        const o = ownerInput.value.trim();
        const r = repoInput.value.trim();
        const p = pathInput.value.trim() || "bdd.json";
        const t = tokenInput.value.trim();

        if (!o || !r || !t) {
          alert("Veuillez remplir l'utilisateur, le dépôt et le jeton (PAT).");
          return;
        }

        saveGhCreds(o, r, p, t);
        updateUiStatus();
        configForm.style.display = "none";
        await fetchFromGitHub();
      };
    }

    if (syncBtn) {
      syncBtn.onclick = () => fetchFromGitHub();
    }

    if (discoBtn) {
      discoBtn.onclick = () => {
        if (confirm("Voulez-vous déconnecter le dépôt GitHub ? Les données restent enregistrées localement.")) {
          saveGhCreds("", "", "bdd.json", "");
          ghSha = "";
          updateUiStatus();
          window.ComptaBridge.setStatus("Déconnecté de GitHub. Données conservées localement.");
        }
      };
    }

    if (isConnected()) {
      fetchFromGitHub(true);
      autoSyncInterval = setInterval(() => fetchFromGitHub(true), 120000);
    }
  });

  window.GitHubBridge = {
    isConnected,
    fetchFromGitHub,
    pushToGitHub
  };
})();
</script>
